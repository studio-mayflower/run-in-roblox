name: Release

# master マージから人手なしで GitHub Release を出す (mf-storybook / rblx-studio-mcp 方式)。
# バージョンの SSOT は Cargo.toml の version (Cargo.lock の同名エントリとも整合)。
# その版のタグ (vX.Y.Z) の Release が既に存在すればスキップ (冪等)。
# リリースしたいときは PR で Cargo.toml の version を上げるだけでよい。

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # `cargo build --locked` fails if the two disagree. Catching it here
          # costs one job instead of four.
          LOCK_VERSION="$(awk '/^name = "run-in-roblox"$/{getline; print}' Cargo.lock | cut -d'"' -f2)"
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.lock has $LOCK_VERSION but Cargo.toml has $VERSION. Run 'cargo update -p run-in-roblox'."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $TAG"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: [version]
    if: needs.version.outputs.exists == 'false'
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest,   target: aarch64-apple-darwin,     label: macos-aarch64 }
          - { host: macos-latest,   target: x86_64-apple-darwin,      label: macos-x86_64 }
          - { host: windows-latest, target: x86_64-pc-windows-msvc,   label: windows-x86_64 }
          - { host: ubuntu-latest,  target: x86_64-unknown-linux-gnu, label: linux-x86_64 }
    env:
      ASSET: run-in-roblox-${{ needs.version.outputs.version }}-${{ matrix.label }}.zip
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # Always build with an explicit --target so an asset's architecture is a
      # property of the matrix rather than of whatever arch GitHub happens to
      # give us. The upstream workflow built for the host arch, which is how a
      # macOS asset stayed x86_64-only long after Apple Silicon shipped.
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          # -j: store the binary at the archive root. Rokit looks for an entry
          # named exactly after the tool, so a nested path would not be found.
          zip -j "dist/$ASSET" "target/${{ matrix.target }}/release/run-in-roblox"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/run-in-roblox.exe" -DestinationPath "dist/$env:ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release is created only after all four builds have produced an
      # archive, so a failed target leaves no half-published tag to clean up.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l dist
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            dist/*.zip
